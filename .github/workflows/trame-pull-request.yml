# Written by trame ship from the graph, for the shipment "Into the main branch" of .
# From the artefact sdlc.PullRequestWorkflow and its settings sdlc.PullRequestsOnGitHub declared in src/sdlc.ts
# Do not edit: change those nodes, then ship.
name: "trame · Into the main branch"
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write
jobs:
  trame:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: "."
      - run: npm ci
        working-directory: apps/poselia
      - run: npx playwright install --with-deps chromium
        working-directory: "."
      - run: "git fetch --depth=1 origin \"$GITHUB_BASE_REF\""
        working-directory: "."
      - run: |
          git diff --quiet FETCH_HEAD -- "$LOCK" || gh pr merge "$NUMBER" --disable-auto || true
        working-directory: "."
        env:
          GH_TOKEN: "${{ github.token }}"
          NUMBER: "${{ github.event.pull_request.number }}"
          LOCK: trame.lock
          MARKER: "<!-- The review of . -->"
      - run: "./trame.sh ship IntoMain --by \"${{ github.actor }}\""
        working-directory: "."
