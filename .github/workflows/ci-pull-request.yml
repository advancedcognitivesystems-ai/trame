# Written by trame ship from the graph, for the shipment "The next version" of ci
# Do not edit: edit the graph, then ship.
name: The next version
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: "."
      - run: "git fetch --depth=1 origin \"$GITHUB_BASE_REF\""
        working-directory: ci
      - run: |
          git diff --quiet FETCH_HEAD -- ":(glob)**/$LOCK" || gh pr merge "$NUMBER" --disable-auto || true
        working-directory: ci
        env:
          GH_TOKEN: "${{ github.token }}"
          NUMBER: "${{ github.event.pull_request.number }}"
          LOCK: trame.lock
          MARKER: "<!-- The review of ci -->"
      - run: "../trame.sh ship NextVersion --by \"${{ github.actor }}\""
        working-directory: ci
